name: Refresh player database

# Sleeper's full player list is ~15 MB, which is far too big to fetch from a
# visitor's phone on every page load. Instead we keep a trimmed copy
# (id -> [name, position, team], ~230 KB) in the repo and refresh it here.
#
# Runs every Tuesday at 09:00 UTC — after Monday Night Football, so team
# changes and practice-squad callups are picked up before the next week.

on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and trim the Sleeper player list
        run: |
          set -euo pipefail
          curl -sfSL --retry 3 --retry-delay 5 \
            "https://api.sleeper.app/v1/players/nfl" -o /tmp/players_full.json

          python3 - <<'PY'
          import json, os

          with open("/tmp/players_full.json") as f:
              data = json.load(f)

          # Guard against a truncated or error response overwriting good data.
          if not isinstance(data, dict) or len(data) < 5000:
              raise SystemExit(f"Refusing to write: got {len(data)} players, expected >5000")

          KEEP = {"QB", "RB", "WR", "TE", "K", "DEF", "DL", "LB", "DB"}
          out = {}
          for pid, p in data.items():
              pos = p.get("position")
              if pos not in KEEP:
                  continue
              name = (
                  p.get("full_name")
                  or f"{p.get('first_name', '')} {p.get('last_name', '')}".strip()
                  or pid
              )
              out[pid] = [name, pos, p.get("team") or "FA"]

          os.makedirs("data", exist_ok=True)
          with open("data/players.json", "w") as f:
              json.dump(out, f, separators=(",", ":"))

          print(f"Wrote {len(out)} players")
          PY

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/players.json; then
            echo "No player changes this week."
          else
            git add data/players.json
            git commit -m "Refresh Sleeper player database"
            git push
          fi
